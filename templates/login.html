<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Отбасы банк</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="min-h-screen flex items-center justify-center" style="background-color: var(--neutral-light-gray);">
    <div class="bg-white p-10 rounded-lg shadow-lg w-full max-w-md">
        <div class="text-center mb-8">
            <img src="/static/images/logo-otbasy-bank.svg" alt="Отбасы банк" style="width: 200px; max-height: 62px; object-fit: contain;" class="mx-auto mb-4">
            <h2 class="text-xl font-semibold" style="color: var(--text-dark);">Вход в систему</h2>
        </div>

        <div id="error-message" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4"></div>

        <form id="login-form">
            <div class="mb-6">
                <label for="username" class="block text-sm font-semibold mb-2" style="color: var(--text-dark);">Имя пользователя</label>
                <input type="text" id="username" name="username" required class="border rounded w-full py-3 px-4" style="border-color: var(--neutral-gray); color: var(--text-dark);">
            </div>

            <div class="mb-8">
                <label for="password" class="block text-sm font-semibold mb-2" style="color: var(--text-dark);">Пароль</label>
                <input type="password" id="password" name="password" required class="border rounded w-full py-3 px-4" style="border-color: var(--neutral-gray); color: var(--text-dark);">
            </div>

            <button type="submit" id="login-btn" class="w-full btn-primary">Войти</button>
        </form>


    </div>

    <script src="/static/js/script.js?v=2"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (Auth.isLoggedIn()) {
                Auth.redirectBasedOnRole();
            }

            document.getElementById('login-form').addEventListener('submit', async function(e) {
                e.preventDefault();
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                const errorDiv = document.getElementById('error-message');
                const loginBtn = document.getElementById('login-btn');

                errorDiv.classList.add('hidden');
                loginBtn.disabled = true;
                loginBtn.textContent = 'Вход...';

                try {
                    await Auth.login(username, password);
                    Auth.redirectBasedOnRole();
                } catch (error) {
                    errorDiv.textContent = error.message || 'Ошибка входа. Проверьте данные.';
                    errorDiv.classList.remove('hidden');
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Войти';
                }
            });
        });
    </script>
</body>
</html>
