{% extends 'base.html' %}

{% block title %}Отчеты - Отбасы банк{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto">
    <h1 id="page-title" class="text-3xl font-bold mb-8" style="color: var(--text-dark);"></h1>

    <div id="reports-loading" class="text-lg" style="color: var(--text-medium);"></div>
    <div id="reports-empty" class="hidden text-lg" style="color: var(--text-medium);"></div>

    <div id="reports-grid" class="hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    document.addEventListener('DOMContentLoaded', async function() {
        Auth.requireAuth();
        updateLabels();
        loadReports();
    });

    function updateLabels() {
        const isKk = I18n.currentLang === 'kk';
        document.getElementById('page-title').textContent = isKk ? 'Есептер' : 'Отчеты';
        document.getElementById('reports-loading').textContent = isKk ? 'Есептер жүктелуде...' : 'Загрузка отчетов...';
        document.getElementById('reports-empty').textContent = isKk ? 'Қол жетімді есептер жоқ.' : 'Нет доступных отчетов.';
    }

    async function loadReports() {
        const loadingDiv = document.getElementById('reports-loading');
        const emptyDiv = document.getElementById('reports-empty');
        const grid = document.getElementById('reports-grid');
        const isKk = I18n.currentLang === 'kk';
        const locale = isKk ? 'kk-KZ' : 'ru-RU';

        try {
            const data = await API.get('/api/reports/');
            const reports = data.results || data;

            loadingDiv.classList.add('hidden');

            if (reports.length === 0) {
                emptyDiv.classList.remove('hidden');
                return;
            }

            grid.innerHTML = '';
            reports.forEach(report => {
                const card = document.createElement('div');
                card.className = 'card p-6 cursor-pointer';
                const viewText = isKk ? 'Есепті қарау →' : 'Просмотреть отчет →';
                card.innerHTML = `
                    <h3 class="text-xl font-bold mb-3" style="color: var(--text-dark);">${escapeHtml(report.title)}</h3>
                    <div class="space-y-2">
                        <p class="text-sm" style="color: var(--text-light);">
                            ${new Date(report.uploaded_at).toLocaleString(locale)}
                        </p>
                    </div>
                    <div class="mt-4 pt-4 border-t" style="border-color: var(--neutral-gray);">
                        <span class="text-sm font-semibold" style="color: var(--primary-teal);">${viewText}</span>
                    </div>
                `;
                card.addEventListener('click', () => {
                    window.location.href = `/report/${report.id}/`;
                });
                grid.appendChild(card);
            });

            grid.classList.remove('hidden');
        } catch (error) {
            loadingDiv.textContent = isKk ? 'Есептерді жүктеу мүмкін болмады.' : 'Не удалось загрузить отчеты.';
        }
    }
</script>
{% endblock %}
