{% extends 'base.html' %}

{% block title %}Отчеты - Отбасы банк{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto">
    <h1 class="text-3xl font-bold mb-8" style="color: var(--text-dark);">Отчеты</h1>

    <div id="reports-loading" class="text-lg" style="color: var(--text-medium);">Загрузка отчетов...</div>
    <div id="reports-empty" class="hidden text-lg" style="color: var(--text-medium);">Нет доступных отчетов.</div>

    <div id="reports-grid" class="hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    document.addEventListener('DOMContentLoaded', async function() {
        Auth.requireAuth();
        loadReports();
    });

    async function loadReports() {
        const loadingDiv = document.getElementById('reports-loading');
        const emptyDiv = document.getElementById('reports-empty');
        const grid = document.getElementById('reports-grid');

        try {
            const data = await API.get('/api/reports/');
            const reports = data.results || data;

            loadingDiv.classList.add('hidden');

            if (reports.length === 0) {
                emptyDiv.classList.remove('hidden');
                return;
            }

            grid.innerHTML = '';
            reports.forEach(report => {
                const card = document.createElement('div');
                card.className = 'card p-6 cursor-pointer';
                card.innerHTML = `
                    <h3 class="text-xl font-bold mb-3" style="color: var(--text-dark);">${escapeHtml(report.title)}</h3>
                    <div class="space-y-2">
                        <p class="text-sm" style="color: var(--text-medium);">
                            <span class="font-semibold">Строк:</span> ${report.row_count}
                        </p>
                        <p class="text-sm" style="color: var(--text-medium);">
                            <span class="font-semibold">Загрузил:</span> ${escapeHtml(report.uploaded_by.username)}
                        </p>
                        <p class="text-sm" style="color: var(--text-light);">
                            ${new Date(report.uploaded_at).toLocaleString('ru-RU')}
                        </p>
                    </div>
                    <div class="mt-4 pt-4 border-t" style="border-color: var(--neutral-gray);">
                        <span class="text-sm font-semibold" style="color: var(--primary-teal);">Просмотреть отчет →</span>
                    </div>
                `;
                card.addEventListener('click', () => {
                    window.location.href = `/report/${report.id}/`;
                });
                grid.appendChild(card);
            });

            grid.classList.remove('hidden');
        } catch (error) {
            loadingDiv.textContent = 'Не удалось загрузить отчеты.';
        }
    }
</script>
{% endblock %}
