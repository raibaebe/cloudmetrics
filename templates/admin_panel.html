{% extends 'base.html' %}

{% block title %}Admin Panel - DataVaultPro{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto">
    <h1 class="text-3xl font-bold text-gray-800 mb-8">Admin Panel</h1>

    <div class="bg-white rounded-lg shadow-md p-6 mb-8">
        <h2 class="text-xl font-semibold text-gray-700 mb-4">Upload Excel File</h2>

        <div id="upload-message" class="hidden px-4 py-3 rounded mb-4"></div>

        <form id="upload-form" enctype="multipart/form-data">
            <div class="mb-4">
                <label for="title" class="block text-gray-700 text-sm font-bold mb-2">Report Title</label>
                <input type="text" id="title" name="title" required
                    class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div class="mb-4">
                <label for="file" class="block text-gray-700 text-sm font-bold mb-2">Excel File (.xlsx, .xls)</label>
                <input type="file" id="file" name="file" accept=".xlsx,.xls" required
                    class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <button type="submit" id="upload-btn"
                class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:ring-2 focus:ring-green-500">
                Upload
            </button>
        </form>
    </div>

    <div class="bg-white rounded-lg shadow-md p-6">
        <h2 class="text-xl font-semibold text-gray-700 mb-4">Recent Uploads</h2>

        <div id="reports-loading" class="text-gray-500">Loading...</div>
        <div id="reports-empty" class="hidden text-gray-500">No reports uploaded yet.</div>

        <table id="reports-table" class="hidden min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Title</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Rows</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Uploaded</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                </tr>
            </thead>
            <tbody id="reports-body" class="bg-white divide-y divide-gray-200">
            </tbody>
        </table>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    document.addEventListener('DOMContentLoaded', async function() {
        Auth.requireAuth();
        if (!Auth.isAdmin()) {
            window.location.href = '/data/';
            return;
        }

        loadReports();

        document.getElementById('upload-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const title = document.getElementById('title').value;
            const fileInput = document.getElementById('file');
            const file = fileInput.files[0];
            const messageDiv = document.getElementById('upload-message');
            const uploadBtn = document.getElementById('upload-btn');

            messageDiv.classList.add('hidden');
            uploadBtn.disabled = true;
            uploadBtn.textContent = 'Uploading...';

            try {
                const formData = new FormData();
                formData.append('title', title);
                formData.append('file', file);

                const response = await API.uploadFile('/api/reports/', formData);

                messageDiv.textContent = 'Report uploaded successfully!';
                messageDiv.className = 'bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-4';
                messageDiv.classList.remove('hidden');

                document.getElementById('upload-form').reset();
                loadReports();
            } catch (error) {
                messageDiv.textContent = error.message || 'Upload failed. Please try again.';
                messageDiv.className = 'bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4';
                messageDiv.classList.remove('hidden');
            } finally {
                uploadBtn.disabled = false;
                uploadBtn.textContent = 'Upload';
            }
        });
    });

    async function loadReports() {
        const loadingDiv = document.getElementById('reports-loading');
        const emptyDiv = document.getElementById('reports-empty');
        const table = document.getElementById('reports-table');
        const tbody = document.getElementById('reports-body');

        try {
            const data = await API.get('/api/reports/');
            const reports = data.results || data;

            loadingDiv.classList.add('hidden');

            if (reports.length === 0) {
                emptyDiv.classList.remove('hidden');
                table.classList.add('hidden');
                return;
            }

            tbody.innerHTML = '';
            reports.forEach(report => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${escapeHtml(report.title)}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${report.row_count}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${new Date(report.uploaded_at).toLocaleString()}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm">
                        <a href="/report/${report.id}/" class="text-blue-600 hover:text-blue-900">View</a>
                    </td>
                `;
                tbody.appendChild(row);
            });

            emptyDiv.classList.add('hidden');
            table.classList.remove('hidden');
        } catch (error) {
            loadingDiv.textContent = 'Failed to load reports.';
        }
    }
</script>
{% endblock %}
