<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создать пользователя - Отбасы банк</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="min-h-screen" style="background-color: var(--neutral-light-gray);">
    <app-navbar></app-navbar>

    <div class="flex items-center justify-center py-12">
        <div class="card p-10 w-full max-w-lg">
            <h2 class="text-2xl text-center font-bold mb-8" style="color: var(--text-dark);">Создать нового пользователя</h2>

            <div id="error-message" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4"></div>
            <div id="success-message" class="hidden bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-4"></div>

            <form id="register-form">
                <div class="mb-5">
                    <label for="username" class="block text-sm font-semibold mb-2" style="color: var(--text-dark);">Имя пользователя</label>
                    <input type="text" id="username" name="username" required class="border rounded w-full py-3 px-4" style="border-color: var(--neutral-gray); color: var(--text-dark);">
                </div>

                <div class="mb-5">
                    <label for="email" class="block text-sm font-semibold mb-2" style="color: var(--text-dark);">Email</label>
                    <input type="email" id="email" name="email" required class="border rounded w-full py-3 px-4" style="border-color: var(--neutral-gray); color: var(--text-dark);">
                </div>

                <div class="mb-5">
                    <label for="password" class="block text-sm font-semibold mb-2" style="color: var(--text-dark);">Пароль</label>
                    <input type="password" id="password" name="password" required minlength="6" class="border rounded w-full py-3 px-4" style="border-color: var(--neutral-gray); color: var(--text-dark);">
                </div>

                <div class="mb-5">
                    <label for="password_confirm" class="block text-sm font-semibold mb-2" style="color: var(--text-dark);">Подтвердите пароль</label>
                    <input type="password" id="password_confirm" name="password_confirm" required minlength="6" class="border rounded w-full py-3 px-4" style="border-color: var(--neutral-gray); color: var(--text-dark);">
                </div>

                <div class="mb-8">
                    <label class="block text-sm font-semibold mb-3" style="color: var(--text-dark);">Тип учетной записи</label>
                    <div class="flex gap-6">
                        <label class="inline-flex items-center cursor-pointer">
                            <input type="radio" name="account_type" value="user" checked class="form-radio h-5 w-5" style="color: var(--primary-teal);">
                            <span class="ml-3 font-medium" style="color: var(--text-medium);">Обычный пользователь</span>
                        </label>
                        <label class="inline-flex items-center cursor-pointer">
                            <input type="radio" name="account_type" value="admin" class="form-radio h-5 w-5" style="color: var(--primary-teal);">
                            <span class="ml-3 font-medium" style="color: var(--text-medium);">Администратор</span>
                        </label>
                    </div>
                </div>

                <button type="submit" id="register-btn" class="w-full btn-primary">Создать пользователя</button>
            </form>
        </div>
    </div>

    <app-footer></app-footer>

    <script src="/static/js/script.js?v=2"></script>
    <script src="/static/js/navbar.js?v=2"></script>
    <script src="/static/js/footer.js?v=2"></script>
    <script>
        if (!Auth.isLoggedIn() || !Auth.isAdmin()) {
            window.location.href = '/';
        }

        document.getElementById('register-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const password_confirm = document.getElementById('password_confirm').value;
            const accountType = document.querySelector('input[name="account_type"]:checked').value;
            const is_admin = accountType === 'admin';
            const errorDiv = document.getElementById('error-message');
            const successDiv = document.getElementById('success-message');
            const registerBtn = document.getElementById('register-btn');

            errorDiv.classList.add('hidden');
            successDiv.classList.add('hidden');

            if (password !== password_confirm) {
                errorDiv.textContent = 'Пароли не совпадают';
                errorDiv.classList.remove('hidden');
                return;
            }

            registerBtn.disabled = true;
            registerBtn.textContent = 'Создание...';

            try {
                const token = Auth.getToken();
                const response = await fetch('/api/register/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ username, email, password, password_confirm, is_admin }),
                });

                const data = await response.json();

                if (!response.ok) {
                    let errorMessage = 'Ошибка создания пользователя';
                    if (data.detail) errorMessage = data.detail;
                    else if (data.username) errorMessage = data.username[0];
                    else if (data.email) errorMessage = data.email[0];
                    else if (data.password) errorMessage = data.password[0];
                    else if (data.password_confirm) errorMessage = data.password_confirm[0];
                    throw new Error(errorMessage);
                }

                successDiv.textContent = `Пользователь ${username} успешно создан!`;
                successDiv.classList.remove('hidden');
                document.getElementById('register-form').reset();
                setTimeout(() => successDiv.classList.add('hidden'), 3000);
            } catch (error) {
                errorDiv.textContent = error.message;
                errorDiv.classList.remove('hidden');
            } finally {
                registerBtn.disabled = false;
                registerBtn.textContent = 'Создать пользователя';
            }
        });
    </script>
</body>
</html>
