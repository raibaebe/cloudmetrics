<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create User - DataVaultPro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-gray-100 min-h-screen">
    <app-navbar></app-navbar>

    <div class="flex items-center justify-center py-8">
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
        <h2 class="text-xl text-center text-gray-800 font-bold mb-6">Create New User</h2>

        <div id="error-message" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4"></div>
        <div id="success-message" class="hidden bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-4"></div>

        <form id="register-form">
            <div class="mb-4">
                <label for="username" class="block text-gray-700 text-sm font-bold mb-2">Username</label>
                <input type="text" id="username" name="username" required
                    class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div class="mb-4">
                <label for="email" class="block text-gray-700 text-sm font-bold mb-2">Email</label>
                <input type="email" id="email" name="email" required
                    class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div class="mb-4">
                <label for="password" class="block text-gray-700 text-sm font-bold mb-2">Password</label>
                <input type="password" id="password" name="password" required minlength="6"
                    class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div class="mb-4">
                <label for="password_confirm" class="block text-gray-700 text-sm font-bold mb-2">Confirm Password</label>
                <input type="password" id="password_confirm" name="password_confirm" required minlength="6"
                    class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2">Account Type</label>
                <div class="flex gap-6">
                    <label class="inline-flex items-center">
                        <input type="radio" name="account_type" value="user" checked
                            class="form-radio h-4 w-4 text-blue-600 focus:ring-2 focus:ring-blue-500">
                        <span class="ml-2 text-gray-700">Regular User</span>
                    </label>
                    <label class="inline-flex items-center">
                        <input type="radio" name="account_type" value="admin"
                            class="form-radio h-4 w-4 text-blue-600 focus:ring-2 focus:ring-blue-500">
                        <span class="ml-2 text-gray-700">Administrator</span>
                    </label>
                </div>
            </div>

            <button type="submit" id="register-btn"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
                Create User
            </button>
        </form>
    </div>
    </div>

    <script src="/static/js/script.js"></script>
    <script src="/static/js/navbar.js"></script>
    <script>
        // Redirect non-admin users
        if (!Auth.isLoggedIn() || !Auth.isAdmin()) {
            window.location.href = '/';
        }

        document.getElementById('register-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const password_confirm = document.getElementById('password_confirm').value;
            const accountType = document.querySelector('input[name="account_type"]:checked').value;
            const is_admin = accountType === 'admin';

            const errorDiv = document.getElementById('error-message');
            const successDiv = document.getElementById('success-message');
            const registerBtn = document.getElementById('register-btn');

            errorDiv.classList.add('hidden');
            successDiv.classList.add('hidden');

            if (password !== password_confirm) {
                errorDiv.textContent = 'Passwords do not match';
                errorDiv.classList.remove('hidden');
                return;
            }

            registerBtn.disabled = true;
            registerBtn.textContent = 'Creating...';

            try {
                const token = Auth.getToken();
                const response = await fetch('/api/register/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ username, email, password, password_confirm, is_admin }),
                });

                const data = await response.json();

                if (!response.ok) {
                    let errorMessage = 'Error creating user';
                    if (data.detail) errorMessage = data.detail;
                    else if (data.username) errorMessage = data.username[0];
                    else if (data.email) errorMessage = data.email[0];
                    else if (data.password) errorMessage = data.password[0];
                    else if (data.password_confirm) errorMessage = data.password_confirm[0];
                    throw new Error(errorMessage);
                }

                successDiv.textContent = `User ${username} created successfully!`;
                successDiv.classList.remove('hidden');

                // Clear form
                document.getElementById('register-form').reset();

                setTimeout(() => {
                    successDiv.classList.add('hidden');
                }, 3000);

            } catch (error) {
                errorDiv.textContent = error.message;
                errorDiv.classList.remove('hidden');
            } finally {
                registerBtn.disabled = false;
                registerBtn.textContent = 'Create User';
            }
        });
    </script>
</body>
</html>
