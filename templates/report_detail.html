{% extends 'base.html' %}

{% block title %}Report Details - DataVaultPro{% endblock %}

{% block content %}
<div class="max-w-full mx-auto">
    <div id="report-loading" class="text-gray-500">Loading report...</div>

    <div id="report-container" class="hidden">
        <div class="mb-6">
            <a href="/data/" class="text-blue-600 hover:text-blue-800">&larr; Back to Reports</a>
        </div>

        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <h1 id="report-title" class="text-2xl font-bold text-gray-800 mb-4"></h1>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-sm text-gray-600">
                <div>
                    <span class="font-semibold">Uploaded by:</span>
                    <span id="report-user"></span>
                </div>
                <div>
                    <span class="font-semibold">Upload date:</span>
                    <span id="report-date"></span>
                </div>
                <div>
                    <span class="font-semibold">Total rows:</span>
                    <span id="report-rows"></span>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-lg shadow-md p-6">
            <h2 class="text-xl font-semibold text-gray-700 mb-4">Data</h2>

            <div class="overflow-x-auto">
                <table id="data-table" class="min-w-full divide-y divide-gray-200">
                    <thead id="data-thead" class="bg-gray-50">
                    </thead>
                    <tbody id="data-tbody" class="bg-white divide-y divide-gray-200">
                    </tbody>
                </table>
            </div>

            <div id="pagination" class="hidden mt-4 flex items-center justify-between">
                <div class="text-sm text-gray-700">
                    Showing <span id="showing-start"></span> to <span id="showing-end"></span> of <span id="total-count"></span> rows
                </div>
                <div class="flex gap-2">
                    <button id="prev-btn" class="px-4 py-2 bg-gray-200 text-gray-700 rounded hover:bg-gray-300 disabled:opacity-50 disabled:cursor-not-allowed">
                        Previous
                    </button>
                    <button id="next-btn" class="px-4 py-2 bg-gray-200 text-gray-700 rounded hover:bg-gray-300 disabled:opacity-50 disabled:cursor-not-allowed">
                        Next
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    let currentPage = 1;
    let reportId = null;
    let totalCount = 0;
    const pageSize = 50;

    document.addEventListener('DOMContentLoaded', async function() {
        Auth.requireAuth();

        const pathParts = window.location.pathname.split('/');
        reportId = pathParts[pathParts.length - 2];

        await loadReport();
        await loadData();

        document.getElementById('prev-btn').addEventListener('click', () => {
            if (currentPage > 1) {
                currentPage--;
                loadData();
            }
        });

        document.getElementById('next-btn').addEventListener('click', () => {
            if (currentPage * pageSize < totalCount) {
                currentPage++;
                loadData();
            }
        });
    });

    async function loadReport() {
        try {
            const report = await API.get(`/api/reports/${reportId}/`);

            document.getElementById('report-title').textContent = report.title;
            document.getElementById('report-user').textContent = report.uploaded_by.username;
            document.getElementById('report-date').textContent = new Date(report.uploaded_at).toLocaleString();
            document.getElementById('report-rows').textContent = report.row_count;

            document.getElementById('report-loading').classList.add('hidden');
            document.getElementById('report-container').classList.remove('hidden');
        } catch (error) {
            document.getElementById('report-loading').textContent = 'Failed to load report.';
        }
    }

    async function loadData() {
        const thead = document.getElementById('data-thead');
        const tbody = document.getElementById('data-tbody');

        try {
            const data = await API.get(`/api/reports/${reportId}/data/?page=${currentPage}&page_size=${pageSize}`);

            totalCount = data.count;
            const rows = data.results;
            const headers = data.headers || [];

            thead.innerHTML = '<tr>' + headers.map(h =>
                `<th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">${escapeHtml(h)}</th>`
            ).join('') + '</tr>';

            tbody.innerHTML = '';
            rows.forEach(row => {
                const tr = document.createElement('tr');
                tr.innerHTML = headers.map(h =>
                    `<td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${escapeHtml(String(row.data[h] ?? ''))}</td>`
                ).join('');
                tbody.appendChild(tr);
            });

            const start = (currentPage - 1) * pageSize + 1;
            const end = Math.min(currentPage * pageSize, totalCount);

            document.getElementById('showing-start').textContent = start;
            document.getElementById('showing-end').textContent = end;
            document.getElementById('total-count').textContent = totalCount;

            document.getElementById('prev-btn').disabled = currentPage === 1;
            document.getElementById('next-btn').disabled = currentPage * pageSize >= totalCount;

            document.getElementById('pagination').classList.remove('hidden');
        } catch (error) {
            tbody.innerHTML = '<tr><td colspan="100%" class="px-6 py-4 text-center text-red-500">Failed to load data.</td></tr>';
        }
    }
</script>
{% endblock %}
