{% extends 'base.html' %}

{% block title %}Детали отчета - Отбасы банк{% endblock %}

{% block content %}
<div class="max-w-full mx-auto">
    <div id="report-loading" class="text-lg" style="color: var(--text-medium);">Загрузка отчета...</div>

    <div id="report-container" class="hidden">
        <div class="mb-6">
            <a href="/data/" class="text-sm font-semibold hover:underline" style="color: var(--primary-teal);">
                ← Назад к отчетам
            </a>
        </div>

        <div class="card p-8 mb-6">
            <h1 id="report-title" class="text-3xl font-bold mb-6" style="color: var(--text-dark);"></h1>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 text-sm">
                <div>
                    <span class="font-semibold" style="color: var(--text-dark);">Загрузил:</span>
                    <span id="report-user" style="color: var(--text-medium);"></span>
                </div>
                <div>
                    <span class="font-semibold" style="color: var(--text-dark);">Дата загрузки:</span>
                    <span id="report-date" style="color: var(--text-medium);"></span>
                </div>
                <div>
                    <span class="font-semibold" style="color: var(--text-dark);">Всего строк:</span>
                    <span id="report-rows" style="color: var(--text-medium);"></span>
                </div>
            </div>
        </div>

        <div class="card p-8">
            <h2 class="text-2xl font-semibold mb-6" style="color: var(--text-dark);">Данные</h2>

            <div class="overflow-x-auto">
                <table id="data-table" class="min-w-full">
                    <thead id="data-thead">
                    </thead>
                    <tbody id="data-tbody">
                    </tbody>
                </table>
            </div>

            <div id="pagination" class="hidden mt-6 flex flex-col md:flex-row items-center justify-between gap-4">
                <div class="text-sm font-medium" style="color: var(--text-medium);">
                    Показаны <span id="showing-start"></span> - <span id="showing-end"></span> из <span id="total-count"></span> строк
                </div>
                <div class="flex gap-3">
                    <button id="prev-btn" class="btn-secondary px-5 py-2 text-sm disabled:opacity-50 disabled:cursor-not-allowed">
                        Назад
                    </button>
                    <button id="next-btn" class="btn-secondary px-5 py-2 text-sm disabled:opacity-50 disabled:cursor-not-allowed">
                        Далее
                    </button>
                </div>
            </div>

            <div id="admin-actions" class="hidden mt-8 pt-6 border-t" style="border-color: var(--neutral-gray);">
                <button id="delete-btn" class="px-6 py-3 rounded font-semibold text-white" style="background-color: #dc2626;">
                    Удалить отчет
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    let currentPage = 1;
    let reportId = null;
    let totalCount = 0;
    const pageSize = 50;

    let reportTitle = '';

    document.addEventListener('DOMContentLoaded', async function() {
        Auth.requireAuth();

        const pathParts = window.location.pathname.split('/');
        reportId = pathParts[pathParts.length - 2];

        await loadReport();
        await loadData();

        if (Auth.isAdmin()) {
            document.getElementById('admin-actions').classList.remove('hidden');
            document.getElementById('delete-btn').addEventListener('click', deleteReport);
        }

        document.getElementById('prev-btn').addEventListener('click', () => {
            if (currentPage > 1) {
                currentPage--;
                loadData();
            }
        });

        document.getElementById('next-btn').addEventListener('click', () => {
            if (currentPage * pageSize < totalCount) {
                currentPage++;
                loadData();
            }
        });
    });

    async function loadReport() {
        try {
            const report = await API.get(`/api/reports/${reportId}/`);

            reportTitle = report.title;
            document.getElementById('report-title').textContent = report.title;
            document.getElementById('report-user').textContent = report.uploaded_by.username;
            document.getElementById('report-date').textContent = new Date(report.uploaded_at).toLocaleString('ru-RU');
            document.getElementById('report-rows').textContent = report.row_count;

            document.getElementById('report-loading').classList.add('hidden');
            document.getElementById('report-container').classList.remove('hidden');
        } catch (error) {
            document.getElementById('report-loading').textContent = 'Не удалось загрузить отчет.';
        }
    }

    async function deleteReport() {
        if (!confirm(`Удалить отчет "${reportTitle}"?`)) return;

        try {
            await API.delete(`/api/reports/${reportId}/`);
            window.location.href = '/data/';
        } catch (error) {
            alert('Ошибка удаления: ' + (error.message || 'Попробуйте снова'));
        }
    }

    async function loadData() {
        const thead = document.getElementById('data-thead');
        const tbody = document.getElementById('data-tbody');

        try {
            const data = await API.get(`/api/reports/${reportId}/data/?page=${currentPage}&page_size=${pageSize}`);

            totalCount = data.count;
            const rows = data.results;
            const headers = data.headers || [];

            const displayHeader = (h) => {
                if (h.startsWith('Unnamed') || h.startsWith('col_')) return '';
                return h;
            };

            thead.innerHTML = '<tr>' + headers.map(h =>
                `<th class="px-6 py-4 text-left text-sm font-semibold uppercase tracking-wider">${escapeHtml(displayHeader(h))}</th>`
            ).join('') + '</tr>';

            tbody.innerHTML = '';
            rows.forEach(row => {
                const tr = document.createElement('tr');
                tr.innerHTML = headers.map(h =>
                    `<td class="px-6 py-4 text-sm" style="color: var(--text-dark);">${escapeHtml(String(row.data[h] ?? ''))}</td>`
                ).join('');
                tbody.appendChild(tr);
            });

            const start = (currentPage - 1) * pageSize + 1;
            const end = Math.min(currentPage * pageSize, totalCount);

            document.getElementById('showing-start').textContent = start;
            document.getElementById('showing-end').textContent = end;
            document.getElementById('total-count').textContent = totalCount;

            document.getElementById('prev-btn').disabled = currentPage === 1;
            document.getElementById('next-btn').disabled = currentPage * pageSize >= totalCount;

            document.getElementById('pagination').classList.remove('hidden');
        } catch (error) {
            tbody.innerHTML = '<tr><td colspan="100%" class="px-6 py-4 text-center text-red-500">Не удалось загрузить данные.</td></tr>';
        }
    }
</script>
{% endblock %}
